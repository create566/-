# 智能监控平台 — Docker Compose
# 启动: docker compose up -d

services:
  app:
    build: .
    container_name: smart-monitor
    ports:
      - "9900:9900"
    environment:
      - LLM_PROVIDER
      - LLM_API_KEY
      - LLM_API_BASE=http://host.docker.internal:8010/v1
      - LLM_MODEL
      - OLLAMA_MODEL
      - DASHSCOPE_MODEL
      - EMBEDDING_PROVIDER
      - EMBEDDING_API_KEY
      - EMBEDDING_API_BASE=http://host.docker.internal:8011/v1
      - EMBEDDING_MODEL
      - EMBEDDING_DIM
      - EMBEDDING_CLOUD_MODEL
      - EMBEDDING_CLOUD_DIM
      - MILVUS_HOST=${MILVUS_HOST:-localhost}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - MILVUS_USER=${MILVUS_USER:-}
      - MILVUS_PASSWORD=${MILVUS_PASSWORD:-}
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-knowledge_base}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-smart_monitor}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FEISHU_ENABLED=${FEISHU_ENABLED:-False}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - API_KEY=${API_KEY:-change-me}
      - REPORT_DIR=./reports
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smart-monitor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: smart-monitor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

volumes:
  redis_data:
