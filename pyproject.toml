[project]
name = "smart-monitor"
version = "1.1.0"
description = "智能 OnCall 监控平台 — 自动检测、智能诊断、飞书告警"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "langgraph>=0.2.0",
    "langchain-openai>=1.0.0",
    "langchain-core>=0.1.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "psutil>=5.9.0",
    "pymysql>=1.1.0",
    "redis>=5.0.0",
    # 数据库
    "sqlalchemy>=2.0.0",
    "aiomysql>=0.2.0",
    # Milvus 向量数据库
    "pymilvus>=2.3.0",
    # 可观测性
    "prometheus-client>=0.19.0",
    # 测试
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]